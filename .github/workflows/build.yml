# Builds the debug APK and runs the unit tests on every push and pull request.
# The APK and the test report are kept as the run's artifacts.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the SDK command-line tools and accepts the licences, so Gradle may fetch the platform and
      # build tools the project needs (gradle.properties turns that off for local builds; -P turns it on here).
      - uses: android-actions/setup-android@v3
        with:
          # Its default list also has "tools", a package the SDK no longer offers (the step fails on it).
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon -Pandroid.builder.sdkDownload=true assembleDebug testDebugUnitTest

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: ABC-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
